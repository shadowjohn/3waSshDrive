name: Windows build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - name: Checkout source and pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore 3waSshDrive.sln

      - name: Test
        run: dotnet test 3waSshDrive.sln --configuration Release --no-restore

      - name: Build WinForms application
        run: dotnet build src/3waSshDrive.App/3waSshDrive.App.csproj --configuration Release --no-restore
