name: Windows build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - name: Checkout source and pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test through build.bat
        shell: cmd
        run: call build.bat

      - name: Verify run.bat launch target
        shell: cmd
        run: call run.bat --check
